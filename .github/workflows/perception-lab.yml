name: Perception lab checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lab:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: packages/guardian-core/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/perception-lab/requirements.lock
      - run: npm run check:core
      - run: python -m venv apps/perception-lab/.venv
      - name: Install pinned lab dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=apps/perception-lab/.venv/Scripts/python.exe
          else
            PY=apps/perception-lab/.venv/bin/python
          fi
          "$PY" -m pip install -r apps/perception-lab/requirements.lock
          "$PY" -m pip install -r apps/perception-lab/requirements-wireless.txt
          "$PY" -m pip install --no-deps -e apps/perception-lab
          "$PY" -m pip check
      - run: npm run check:lab
