name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: |
            apps/api/pom.xml
            packages/guardian-core/pom.xml
      - run: bash mvnw --batch-mode --no-transfer-progress -f ../../packages/guardian-core/pom.xml clean verify
        working-directory: apps/api
      - run: bash mvnw --batch-mode --no-transfer-progress verify
        working-directory: apps/api
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run doctor
      - run: npm run build:web
      - run: npm run smoke
