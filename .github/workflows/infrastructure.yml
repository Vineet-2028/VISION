name: Infrastructure checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Non-secret placeholders for interpolation only; no containers are started.
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-placeholder
          MINIO_ROOT_USER: sentinel-ci
          MINIO_ROOT_PASSWORD: ci-only-placeholder
