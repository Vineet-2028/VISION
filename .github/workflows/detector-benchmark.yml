name: Manual detector diagnostic
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Research checkpoint (no production approval)
        type: choice
        required: true
        options: [yolo26n, yolo26s, yolo11n]
      size:
        description: Input resolution
        type: choice
        default: "640"
        options: ["512", "640", "768"]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE: ${{ inputs.candidate }}
      INPUT_SIZE: ${{ inputs.size }}
      YOLO_AUTOINSTALL: "False"
      YOLO_OFFLINE: "True"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: packages/guardian-core/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm run check:core
      - run: |
          python -m venv apps/perception-lab/.venv
          apps/perception-lab/.venv/bin/python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          apps/perception-lab/.venv/bin/python -m pip install -r apps/perception-lab/requirements.lock -r apps/perception-lab/requirements-models.txt
          apps/perception-lab/.venv/bin/python -m pip install --no-deps -e apps/perception-lab
          apps/perception-lab/.venv/bin/python -m pip check
      - name: Acquire official research artifacts
        run: |
          set -euo pipefail
          mkdir -p datasets/raw/coco2017 benchmark-results/models
          curl --fail --location --retry 3 https://s3.amazonaws.com/images.cocodataset.org/annotations/annotations_trainval2017.zip -o datasets/raw/coco2017/annotations_trainval2017.zip
          apps/perception-lab/.venv/bin/python tools/curate_coco.py
          curl --fail --location --retry 3 "https://github.com/ultralytics/assets/releases/download/v8.4.0/${CANDIDATE}.pt" -o "benchmark-results/models/${CANDIDATE}.pt"
      - name: Run measured diagnostic
        run: |
          set -euo pipefail
          WEIGHTS="benchmark-results/models/${CANDIDATE}.pt"
          HASH=$(sha256sum "$WEIGHTS" | cut -d ' ' -f 1)
          EXPECTED=$(python -c 'import json,os; print(next(x["sha256"] for x in json.load(open("configs/detector-checkpoints.json"))["checkpoints"] if x["id"] == os.environ["CANDIDATE"]))')
          test "$HASH" = "$EXPECTED"
          apps/perception-lab/.venv/bin/python -m perception_lab.detector_benchmark --dataset datasets/raw/coco2017/sentinel-subset.json --weights "$WEIGHTS" --sha256 "$HASH" --size "$INPUT_SIZE" --output benchmark-results/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-diagnostic
          path: benchmark-results/report.json
          if-no-files-found: error
